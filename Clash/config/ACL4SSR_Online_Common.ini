;谷歌FCM
ruleset=📢 谷歌FCM,https://gh.20220727.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list

;微软
ruleset=Ⓜ️ 微软服务,https://gh.20220727.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
