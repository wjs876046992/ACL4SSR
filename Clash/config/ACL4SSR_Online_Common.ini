[custom]
;acl4SSR规则_自用Herman

;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持
;地区分组：支持

;设置规则标志位
;全球直连
ruleset=🎯 全球直连,https://gh.20220727.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
